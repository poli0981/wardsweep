# Release pipeline.
#
# Produces installer + portable zip, records SHA-256 for every artifact, and
# emits the verification block for the release notes.
#
# VirusTotal upload and false-positive filing are MANUAL post-release steps —
# see docs/14-DISTRIBUTION-TRUST.md. They are intentionally not automated: the
# permalink must be checked by a human before it goes into the notes.
#
# NOTE: explicit `permissions:` required — see rust-ci.yml.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.5.0)'
        required: true

# Read-only by default; each job asks for exactly what it uses. The build job
# runs a compiler, a packager and every build script of every dependency, and
# none of that needs to be able to write to the repository.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      # Build provenance attestation.
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: ver
        # The dispatch input arrives through the environment, never spliced
        # into the script, and must be a plain version: it names files and a
        # package below, and is the one value here a person types.
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/v',''
          } else { $env:INPUT_VERSION }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            Write-Host "::error::version '$v' is not MAJOR.MINOR.PATCH, with an optional pre-release suffix"
            exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }

      # No packing, no obfuscation — packers are the strongest AV heuristic.
      # See docs/14-DISTRIBUTION-TRUST.md.
      - name: Build broker + CLI
        # --locked so the release is built from the committed Cargo.lock and not
        # from whatever resolved that morning. docs/14-DISTRIBUTION-TRUST.md
        # rests on anyone being able to rebuild these bytes.
        run: cargo build --release --workspace --locked

      - name: Build UI
        run: dotnet publish ui/WardSweep.UI -c Release -r win-x64 --self-contained false -o artifacts/publish

      - name: Stage native binaries and catalog
        # The Rust binaries are built into target/release and are not otherwise
        # copied anywhere the packaging steps look. docs/14 lists wardsweep.exe
        # and wardsweep-broker.exe as release artifacts requiring their own
        # SHA-256 and VirusTotal entries, so they have to be in the pack dir.
        shell: pwsh
        run: |
          Copy-Item target/release/wardsweep.exe        artifacts/publish/ -Force
          Copy-Item target/release/wardsweep-broker.exe artifacts/publish/ -Force
          # Ship the PDBs: docs/14 lists them as a detection-reduction measure.
          # Named, not globbed: the harness and the catalog tool are built too,
          # and neither belongs in this package.
          Copy-Item target/release/wardsweep.pdb, target/release/wardsweep_broker.pdb artifacts/publish/ -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifacts/publish/catalog | Out-Null
          Copy-Item catalog/catalog.toml     artifacts/publish/catalog/ -Force
          Copy-Item catalog/catalog.toml.sig artifacts/publish/catalog/ -Force
          # The licences: WardSweep's own, and every third-party component's,
          # with the texts their licences require to travel with the binaries.
          # CI has already checked the generated lists against the lock files.
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md artifacts/publish/ -Force
          New-Item -ItemType Directory -Force artifacts/publish/licenses | Out-Null
          Copy-Item licenses/*.md artifacts/publish/licenses/ -Force
          Get-ChildItem artifacts/publish

      - name: Package (Velopack)
        # vpk is pinned in .config/dotnet-tools.json: a release rebuilt from the
        # same commit has to come out of the same packager.
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dotnet tool restore
          dotnet vpk pack --packId WardSweep --packVersion $env:VERSION `
                   --packDir artifacts/publish --mainExe WardSweep.UI.exe `
                   --outputDir artifacts

      - name: Portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/WardSweep-$env:VERSION-portable.zip"

      - name: Package the observation harness
        # A download of its own, for contributors building catalog entries
        # (docs/16-OBSERVATION-HARNESS.md); `wardsweep observe` runs it once it
        # is extracted beside wardsweep.exe. Kept out of the main package on
        # purpose: a binary that reads the whole registry and filesystem is
        # what heuristic engines flag, and the uninstaller's users never run
        # it. See docs/14-DISTRIBUTION-TRUST.md.
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $dir = 'artifacts/observe'
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Copy-Item target/release/wardsweep-observe.exe $dir/ -Force
          Copy-Item target/release/wardsweep_observe.pdb $dir/ -Force -ErrorAction SilentlyContinue
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md $dir/ -Force
          Copy-Item licenses/*.md "$dir/licenses/" -Force
          Compress-Archive -Path "$dir/*" -DestinationPath "artifacts/WardSweep-observe-$env:VERSION.zip"

      - name: Compute SHA-256
        shell: pwsh
        run: |
          # The header rows matter: body rows alone are not a markdown table and
          # render as one run-on line in the release notes.
          $lines = @(
            '### Verification'
            ''
            'These builds are **not code-signed**. SmartScreen and some antivirus'
            'engines will flag them; see docs/14-DISTRIBUTION-TRUST.md. Verify the'
            'SHA-256 of what you downloaded against this table.'
            ''
            '| Artifact | SHA-256 | VirusTotal |'
            '|---|---|---|'
          )
          $lines += Get-ChildItem artifacts -Include *.exe,*.zip -Recurse | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "| ``$($_.Name)`` | ``$h`` | [report](https://www.virustotal.com/gui/file/$h) |"
          }
          $lines | Out-File artifacts/VERIFICATION.md -Encoding utf8
          Get-Content artifacts/VERIFICATION.md

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'artifacts/*.exe, artifacts/*.zip'

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: artifacts/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Creating the draft release is the one write this workflow makes.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: release-artifacts, path: artifacts }

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true   # NEVER auto-publish: VirusTotal links go in by hand
          body_path: artifacts/VERIFICATION.md
          files: |
            artifacts/*.exe
            artifacts/*.zip

      - name: Post-release checklist
        run: |
          echo "::notice::Draft created. Before publishing:"
          echo "::notice::1. Upload each artifact to VirusTotal"
          echo "::notice::2. Wait ~10 min for engines to settle"
          echo "::notice::3. Paste permalinks + detection count into the notes"
          echo "::notice::4. File false positives per docs/14-DISTRIBUTION-TRUST.md"
          echo "::notice::5. Update docs/RELEASES.md"
          echo "::notice::6. Then publish"
