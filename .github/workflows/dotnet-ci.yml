# .NET CI.
#
# Inline rather than a caller stub — see the note in rust-ci.yml.
#
# NOTE: explicit `permissions:` required.
name: .NET CI

on:
  push:
    branches: [main]
    paths: ['ui/**', '*.sln', 'Directory.Build.props', 'Directory.Packages.props', 'global.json', 'nuget.config', 'Settings.XamlStyler', '.config/dotnet-tools.json', 'licenses/**', '.github/scripts/notices.py', '.github/workflows/dotnet-ci.yml']
  pull_request:
    paths: ['ui/**', '*.sln', 'Directory.Build.props', 'Directory.Packages.props', 'global.json', 'nuget.config', 'Settings.XamlStyler', '.config/dotnet-tools.json', 'licenses/**', '.github/scripts/notices.py', '.github/workflows/dotnet-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          # global.json pins the SDK; this installs whatever it names, so the
          # version lives in exactly one place.
          global-json-file: global.json

      - name: Restore
        # --locked-mode fails if packages.lock.json is out of date rather than
        # silently updating it. docs/14-DISTRIBUTION-TRUST.md wants builds that
        # reproduce, which means the lock file is authoritative.
        run: dotnet restore WardSweep.sln --locked-mode

      - name: Build
        run: dotnet build WardSweep.sln -c Release --no-restore

      - name: Format check
        run: dotnet format WardSweep.sln --verify-no-changes --severity warn --no-restore

      - name: Test
        run: dotnet test WardSweep.sln -c Release --no-build

  arch-tests:
    # Its own check on purpose. docs/09-UI-SPEC.md states that the UI process
    # has no destructive code path at all, and a guarantee that shares a green
    # tick with everything else is easy to stop noticing.
    name: architecture tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore WardSweep.sln --locked-mode

      - name: No destructive code path in the UI
        # A filter that matches nothing exits non-zero with "No test matches",
        # so this also fails if the tests are ever renamed out of the category.
        run: dotnet test WardSweep.sln -c Release --filter "Category=Architecture"

  vulnerable-packages:
    name: vulnerable packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore WardSweep.sln --locked-mode

      - name: Scan, transitively
        # Hard gate. `dotnet list package --vulnerable` reports findings on
        # stdout and still exits 0, so the exit code alone would pass a build
        # with a known-vulnerable dependency in it.
        shell: pwsh
        run: |
          $output = dotnet list WardSweep.sln package --vulnerable --include-transitive | Out-String
          Write-Host $output
          if ($output -match 'has the following vulnerable packages') {
            Write-Host "::error::vulnerable packages found"
            exit 1
          }
          Write-Host "no vulnerable packages"

  notices:
    # licenses/dotnet.md is read from the restored packages' own nuspecs and
    # licence files, so a package change that leaves it stale fails here.
    name: third-party notices (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore WardSweep.sln --locked-mode

      - name: Restore the pinned tools
        # Velopack's package carries its licence, and vpk is a tool.
        run: dotnet tool restore

      - run: python .github/scripts/notices.py --check dotnet

  xaml-style:
    name: XamlStyler
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the pinned tools
        # .config/dotnet-tools.json fixes the XamlStyler version, so the check
        # cannot change its mind about the same XAML between two runs.
        run: dotnet tool restore

      - name: Check XAML formatting
        shell: pwsh
        run: |
          $output = dotnet xstyler --passive --recursive --directory ui | Out-String
          Write-Host $output
          if ($output -match 'FAIL') {
            Write-Host "::error::XAML is not XamlStyler-clean; run 'dotnet xstyler --recursive --directory ui'"
            exit 1
          }
