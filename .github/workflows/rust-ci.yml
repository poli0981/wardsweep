# Rust CI.
#
# Inline rather than a caller stub. docs/14-DISTRIBUTION-TRUST.md rests on
# public, inspectable CI: an unsigned binary's trust story is that anyone can
# see how it was built and rebuild it themselves. A pipeline that lives in
# another repository cannot be read from here.
#
# NOTE: `permissions:` are declared explicitly — standing rule across the
# portfolio, and they are not reliably inherited.
#
# Every checkout sets `persist-credentials: false`: nothing here pushes, and a
# token left in .git/config is readable by every later step. Third-party actions
# are pinned to commit SHAs, which Dependabot keeps current; GitHub's own are
# referenced by tag.
name: Rust CI

# observations/** is here because a test rebuilds a committed draft catalog
# entry from its committed diff, so a change to either has to re-run it.
on:
  push:
    branches: [main]
    # .github/scripts/** too: the bench job runs check_bench_budget.py on push
    # only, so a change to the script alone was never executed anywhere.
    paths: ['core/**', 'cli/**', 'tools/**', 'Cargo.*', 'catalog/**', 'rust-toolchain.toml', 'clippy.toml', 'rustfmt.toml', 'deny.toml', 'observations/**', 'about.toml', 'about.hbs', 'licenses/**', '.github/workflows/rust-ci.yml', '.github/scripts/**']
  pull_request:
    paths: ['core/**', 'cli/**', 'tools/**', 'Cargo.*', 'catalog/**', 'rust-toolchain.toml', 'clippy.toml', 'rustfmt.toml', 'deny.toml', 'observations/**', 'about.toml', 'about.hbs', 'licenses/**', '.github/workflows/rust-ci.yml', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    # ubuntu on purpose. Everything reachable from the catalog gate is pure
    # logic, and building it with cfg(windows) off is what proves no Win32
    # dependency has leaked into it — see docs/12-TESTING-STRATEGY.md on
    # pure-logic crates being linted on Linux.
    name: fmt + clippy (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the version and
        # the components; `rustup show` installs whatever it names.
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic

  test-windows:
    # Sandbox tests create services and load registry hives, so they need a
    # Windows runner. Clippy runs here too: with cfg(windows) off, the linux
    # job never lints a single Win32 code path.
    name: clippy + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic

      - run: cargo test --all-features --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  notices:
    # licenses/rust.md is what every release carries to meet the licences of
    # the crates in it, so a dependency change that leaves it stale fails here
    # rather than at release time. cargo-about reads the crates' own licence
    # files offline; the same Cargo.lock always gives the same bytes.
    name: third-party notices (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-about
        # Pinned: a different version may lay the same licences out
        # differently, and the check compares bytes.
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - run: cargo fetch --locked

      - run: python3 .github/scripts/notices.py --check rust

  bench:
    # docs/10-PERF-BUDGET.md: "Budgets are enforced, not aspirational."
    name: scan_corpus benchmark
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo bench --bench scan_corpus

      - name: Enforce the docs/10 hard-fail budgets
        shell: bash
        run: python .github/scripts/check_bench_budget.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: criterion-report
          path: target/criterion/
          retention-days: 14
