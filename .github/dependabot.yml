# Version updates. Security updates are enabled in the repository settings and
# do not depend on this file.
#
# Grouped and infrequent on purpose: every update here is a pull request that
# runs the full CI, and a lock file that moves weekly in twenty pull requests
# is one nobody reads. Actions are weekly because they run with repository
# tokens; the third-party ones are pinned to commit SHAs, and this is what keeps
# those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # Pinned below 0.8 on purpose: 0.8 depends on `alloca`, which needs a C
      # toolchain for the target being built, and that ends cross-linting the
      # workspace for Linux from Windows — the documented way to reproduce the
      # ubuntu lint job locally. See core/benches/scan_corpus.rs.
      - dependency-name: criterion
        versions: ['>= 0.8']

  # Directory.Packages.props, the lock files restored with --locked-mode, and
  # the tool manifest in .config/dotnet-tools.json.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      nuget:
        update-types: [minor, patch]
