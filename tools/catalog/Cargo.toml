[package]
name = "wardsweep-catalog"
description = "Catalog integrity gate: schema validation, Ed25519 verification, deny-list conflict detection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# .github/workflows/catalog-verify.yml builds and runs this on ubuntu-latest.
# It must therefore stay free of any Windows-only dependency, transitively.
# Verify with: cargo tree -p wardsweep-catalog -e normal --target x86_64-unknown-linux-gnu
[[bin]]
name = "wardsweep-catalog"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
toml.workspace = true
wardsweep-core.workspace = true
