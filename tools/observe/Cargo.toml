[package]
name = "wardsweep-observe"
description = "Read-only snapshot and diff harness used to derive catalog entries from real machines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# A separate binary from the broker on purpose: docs/16-OBSERVATION-HARNESS.md
# requires the harness to have no removal code path at all. `wardsweep observe`
# in the CLI forwards to this executable rather than linking its logic in.
[[bin]]
name = "wardsweep-observe"
path = "src/main.rs"

[dependencies]
# The draft generator builds a real schema::AntiCheat rather than writing
# TOML by hand, so a draft cannot drift from the schema it has to satisfy.
wardsweep-core.workspace = true

anyhow.workspace = true
clap.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
# Cleans up its own temp trees on Drop. The inline test modules in src/ cannot
# call std::fs::remove_dir_all themselves: core/tests/no_destructive_code.rs
# scopes its ban by directory, and although its comment says "test and benchmark
# code may clean up after itself", a #[cfg(test)] module inside src/ is not
# reached by that exemption.
tempfile.workspace = true

# Everything Win32 lives here, never behind a cargo feature: the CI lint job
# runs `clippy --all-features` on ubuntu-latest. Only `snapshot` needs Windows —
# the model, the differ and the draft generator are pure logic and are tested
# on Linux, which is the point of keeping them apart.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Cryptography",
] }
