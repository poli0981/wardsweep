# cargo-deny configuration.
#
# CI runs: cargo deny check advisories bans licenses sources
# See .github/workflows/rust-ci.yml (job `deny`).

[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# WardSweep application code is GPL-3.0-or-later (COPYING.md), so GPL-compatible
# dependency licences only. Anything not listed here needs a deliberate decision.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # WardSweep's own crates. `GPL-3.0` on its own is the deprecated SPDX id, so
  # both current forms are listed rather than the ambiguous one.
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# docs/01-VISION-SCOPE.md: zero network by default. A TLS or HTTP stack showing
# up in the graph means something reached for the network — that is a review
# event, not a routine dependency bump.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
