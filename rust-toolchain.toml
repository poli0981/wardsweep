# Pinned rather than "stable" because docs/14-DISTRIBUTION-TRUST.md relies on
# reproducible builds: an unsigned binary's only trust story is that anyone can
# rebuild it and get the same hash. CI uses dtolnay/rust-toolchain@stable, which
# honours this file.
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
