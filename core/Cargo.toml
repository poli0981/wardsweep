[package]
name = "wardsweep-core"
description = "WardSweep broker core: safety gate, catalog, detection, plan, execution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Required by .github/workflows/rust-ci.yml (`--bench scan_corpus`). The bench
# job runs on every push to main, so this target must exist even while the
# corpus behind it is still small.
[[bench]]
name = "scan_corpus"
harness = false

[dependencies]
aho-corasick.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
# Epic's library manifests are JSON (`scan::libraries`).
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
# Cleans up its own temp trees on Drop; see the note in tools/observe/Cargo.toml
# on why an inline test module may not call std::fs::remove_dir_all itself.
tempfile.workspace = true

# Everything Win32 lives here, never behind a cargo feature: the CI lint job
# runs `clippy --all-features` on ubuntu-latest and a feature-gated windows
# dependency would break it. See docs/12-TESTING-STRATEGY.md on pure-logic
# crates being linted and tested on Linux.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Services",
] }
